name: Extract StickNodes ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check ZIP exists
        run: |
          if [ ! -f "sticknodes.zip" ]; then
            echo "sticknodes.zip not found!"
            exit 1
          fi

      - name: Extract sticknodes.zip
        run: |
          unzip -o "sticknodes.zip" -d .

      - name: Remove ZIP
        run: |
          rm -f "sticknodes.zip"

      - name: Show extracted files
        run: |
          echo "Repository contents after extraction:"
          find . -type f \
            ! -path './.git/*' \
            ! -path './.github/workflows/extract-sticknodes.yml' \
            | sort

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Extract sticknodes.zip"
          git push
